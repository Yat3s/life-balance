; All times use Asia/Shanghai (UTC+08:00).
; Start and end are INCLUDED. No parking requests outside these windows.
; Each workday: 37 morning samples + 19 evening samples = 56 combined records.

[morning]
start = 07:30
end = 10:30
interval_minutes = 5

[evening]
start = 16:30
end = 19:30
interval_minutes = 10

[storage]
; Keep today's in-progress collection plus 7 completed days. Only the latter are queryable.
retention_days = 8

; Holidays and weekend makeup workdays are loaded automatically.
; Refresh once per day; a validated cache may cover an outage for up to 7 days.
; Without a usable calendar, skip collection and report an error, never guess.
[calendar]
refresh_hours = 24
max_stale_hours = 168
